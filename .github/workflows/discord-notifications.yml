name: Notify Discord on Push

on:
  push:
    branches:
      - live
      - dev

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "**Tuxedo Trades Github Push** Commit by: ${{ github.actor }} in ${{ github.repository }}"}' \
          "https://discord.com/api/webhooks/1345154189864734874/BkN-x6zyDXKEgEs3qbR9SaqvFjJwQn6CoT4TfZqmYos8KyrgLcUYq7_5Co-tJjtNr5ZL"
